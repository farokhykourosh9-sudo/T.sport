<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SPORT T — PREMIUM GEAR</title>
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;600;700;800;900&family=Orbitron:wght@500;700;900&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  
  :root {
    --black: #050208;
    --card-bg: #0d0714;
    --card-inner: #130a1e;
    --purple: #9d00ff;
    --purple-2: #6a00ff;
    --purple-light: #c77dff;
    --pink: #ff0080;
    --pink-light: #ff66c4;
    --ice: #e0f4ff;
    --ice-blue: #a8dcff;
    --ice-white: #f0faff;
  }
  
  html { scroll-behavior: smooth; }
  
  body {
    font-family: 'Vazirmatn', sans-serif;
    background: var(--black);
    color: #fff;
    overflow-x: hidden;
    min-height: 100vh;
  }
  
  /* ============ لودر ============ */
  .loader {
    position: fixed; inset: 0; background: #000; z-index: 10000;
    display: flex; align-items: center; justify-content: center; flex-direction: column; gap: 30px;
    transition: opacity 0.8s, visibility 0.8s;
  }
  .loader.hidden { opacity: 0; visibility: hidden; }
  .loader-logo {
    font-family: 'Orbitron', sans-serif; font-size: 3rem; font-weight: 900; letter-spacing: 8px;
    background: linear-gradient(90deg, #fff, var(--ice-blue), var(--pink-light), #fff);
    background-size: 300% auto; -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent;
    animation: shine 2s linear infinite;
  }
  .loader-bar { width: 200px; height: 3px; background: rgba(255,255,255,0.1); border-radius: 10px; overflow: hidden; position: relative; }
  .loader-bar::after {
    content: ''; position: absolute; inset: 0; background: linear-gradient(90deg, var(--ice-blue), var(--pink));
    transform: translateX(-100%); animation: loadBar 1.5s ease-out forwards; box-shadow: 0 0 20px var(--ice-blue);
  }
  @keyframes loadBar { to { transform: translateX(0); } }
  @keyframes shine { to { background-position: 300% center; } }
  
  /* ============ پس‌زمینه ============ */
  .bg-layer {
    position: fixed; inset: 0; z-index: -3; pointer-events: none; overflow: hidden;
    background-color: var(--black);
    background-image: url('https://images.unsplash.com/photo-1534447677768-be436bb09401?q=80&w=2000&auto=format&fit=crop');
    background-size: cover;
    background-position: center bottom;
    background-repeat: no-repeat;
  }
  .bg-layer::before {
    content: ''; position: absolute; inset: 0;
    background: linear-gradient(180deg, rgba(5,2,8,0.4) 0%, rgba(5,2,8,0.85) 60%, rgba(5,2,8,1) 100%);
  }
  .storm-sky {
    position: absolute; inset: 0;
    background: radial-gradient(ellipse 60% 40% at 20% 20%, rgba(157,0,255,0.15), transparent 60%), 
                radial-gradient(ellipse 50% 40% at 80% 30%, rgba(106,0,255,0.1), transparent 60%);
    animation: skyDrift 25s ease-in-out infinite alternate;
  }
  @keyframes skyDrift { 0% { transform: scale(1) translateX(0); } 100% { transform: scale(1.1) translateX(-30px); } }
  
  .lightning-flash {
    position: fixed; inset: 0; background: radial-gradient(ellipse at var(--fx, 50%) var(--fy, 30%), rgba(240,250,255,0.85) 0%, rgba(168,220,255,0.4) 20%, transparent 60%);
    opacity: 0; z-index: -2; pointer-events: none; mix-blend-mode: screen;
  }
  .lightning-flash.flash-1 { animation: flashAnim 0.6s ease-out; }
  .lightning-flash.flash-2 { animation: flashAnim 0.8s ease-out; }
  @keyframes flashAnim {
    0% { opacity: 0; } 5% { opacity: 0.9; } 10% { opacity: 0.2; } 15% { opacity: 0.7; } 25% { opacity: 0.3; } 100% { opacity: 0; }
  }
  
  .lightning-container { position: absolute; inset: 0; z-index: -1; pointer-events: none; }
  .lightning-bolt {
    position: absolute; opacity: 0;
    filter: drop-shadow(0 0 4px #fff) drop-shadow(0 0 12px var(--ice-blue)) drop-shadow(0 0 20px var(--purple));
  }
  .lightning-bolt.strike { animation: lightningStrike 1.2s ease-out; }
  @keyframes lightningStrike {
    0% { opacity: 0; } 3% { opacity: 1; } 6% { opacity: 0.5; } 9% { opacity: 0.95; } 14% { opacity: 0.6; } 20% { opacity: 0.9; } 30% { opacity: 0.2; } 100% { opacity: 0; }
  }
  
  .bolt-main { stroke: #fff; stroke-width: 0.8; fill: none; stroke-linecap: round; stroke-linejoin: round; }
  .bolt-branch-1 { stroke: var(--ice-blue); stroke-width: 0.4; fill: none; stroke-linecap: round; stroke-linejoin: round; opacity: 0.9; }
  .bolt-branch-2 { stroke: var(--purple-light); stroke-width: 0.2; fill: none; stroke-linecap: round; stroke-linejoin: round; opacity: 0.7; }
  
  #rain-canvas { position: absolute; inset: 0; width: 100%; height: 100%; opacity: 0.4; }
  
  .grain {
    position: fixed; inset: 0; z-index: 0; pointer-events: none; opacity: 0.05;
    background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 400 400' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
  }
  
  /* ============================================= */
  /* ★★★ ناوبری مگا منو (Mega Menu) ★★★ */
  /* ============================================= */
  nav {
    position: fixed; top: 0; left: 0; width: 100%; z-index: 100;
    background: rgba(10, 4, 16, 0.75); backdrop-filter: blur(24px); border-bottom: 1px solid rgba(168,220,255,0.15);
    transition: all 0.4s;
  }
  .nav-top {
    max-width: 1400px; margin: 0 auto; display: flex; justify-content: space-between; align-items: center; padding: 14px 28px; position: relative; z-index: 2;
  }
  .logo { font-family: 'Orbitron', sans-serif; font-size: 22px; font-weight: 900; letter-spacing: 3px; display: flex; align-items: center; gap: 12px; cursor: pointer; }
  .logo-mark { width: 34px; height: 34px; position: relative; display: flex; align-items: center; justify-content: center; }
  .logo-mark::before, .logo-mark::after {
    content: ''; position: absolute; inset: 0; border-radius: 10px; border: 1.5px solid var(--ice-blue); animation: rotateBox 4s linear infinite; box-shadow: 0 0 10px var(--ice-blue);
  }
  .logo-mark::after { border-color: var(--purple); animation: rotateBox 4s linear infinite reverse; inset: 4px; border-radius: 8px; box-shadow: 0 0 10px var(--purple); }
  @keyframes rotateBox { to { transform: rotate(360deg); } }
  .logo-text {
    background: linear-gradient(90deg, #fff, var(--ice-blue), var(--pink-light)); background-size: 200% auto;
    -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent; filter: drop-shadow(0 0 12px rgba(168,220,255,0.6)); animation: shine 4s linear infinite;
  }
  
  /* دکمه سبد خرید */
  .cart-btn {
    position: relative; background: linear-gradient(135deg, var(--purple-2), var(--pink)); border: none; color: #fff; padding: 10px 20px;
    border-radius: 12px; font-family: inherit; font-weight: 700; font-size: 14px; display: flex; align-items: center; gap: 10px; transition: all 0.3s;
    box-shadow: 0 0 0 1px rgba(255,255,255,0.1) inset, 0 8px 25px rgba(157,0,255,0.4); overflow: hidden; cursor: pointer;
  }
  .cart-btn:hover { transform: translateY(-2px); box-shadow: 0 12px 35px rgba(255,0,128,0.6); }
  .cart-count { background: #fff; color: var(--pink); border-radius: 50px; min-width: 22px; height: 22px; display: flex; align-items: center; justify-content: center; font-size: 11px; font-weight: 900; padding: 0 6px; transition: transform 0.3s; }
  .cart-count.bump { transform: scale(1.4); }

  /* ساختار منو (دسکتاپ) */
  .mega-menu-wrapper {
    max-width: 1400px; margin: 0 auto; display: flex; justify-content: center; gap: 10px; padding: 0 20px 14px;
    position: relative; z-index: 2;
  }
  .mega-item {
    position: relative;
  }
  .mega-btn {
    background: transparent; border: 1px solid transparent; color: #b8b8c8; padding: 8px 16px; border-radius: 10px;
    font-family: inherit; font-size: 14px; font-weight: 700; cursor: pointer; transition: all 0.3s; display: flex; align-items: center; gap: 6px;
  }
  .mega-btn:hover, .mega-item:hover .mega-btn { color: #fff; background: rgba(255,255,255,0.05); border-color: rgba(168,220,255,0.3); box-shadow: 0 0 15px rgba(168,220,255,0.2); }
  
  /* پنل مگا منو (شیشه‌ای) */
  .mega-panel {
    position: absolute; top: calc(100% + 5px); left: 50%; transform: translateX(-50%) translateY(10px);
    background: rgba(13, 7, 20, 0.95); backdrop-filter: blur(30px); border: 1px solid rgba(168,220,255,0.2);
    border-radius: 20px; padding: 24px; min-width: 400px; width: max-content; max-width: 800px;
    box-shadow: 0 20px 50px rgba(0,0,0,0.8), 0 0 30px rgba(157,0,255,0.2);
    opacity: 0; visibility: hidden; transition: all 0.3s cubic-bezier(0.2, 0.9, 0.3, 1.3);
    display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 10px;
    pointer-events: none; z-index: 100;
  }
  
  /* با هاور روی آیتم، پنل نمایش داده می‌شود */
  .mega-item:hover .mega-panel {
    opacity: 1; visibility: visible; transform: translateX(-50%) translateY(0); pointer-events: auto;
  }
  
  .sub-cat-btn {
    display: flex; align-items: center; gap: 10px; padding: 10px 14px; border-radius: 12px;
    color: #a0a0b0; font-size: 13px; font-weight: 600; cursor: pointer; transition: all 0.2s; text-decoration: none;
  }
  .sub-cat-btn::before {
    content: ''; width: 6px; height: 6px; border-radius: 50%; background: var(--purple-light); opacity: 0.5; transition: all 0.2s;
  }
  .sub-cat-btn:hover {
    background: rgba(168,220,255,0.1); color: #fff; transform: translateX(-5px);
  }
  .sub-cat-btn:hover::before {
    background: var(--ice-white); opacity: 1; box-shadow: 0 0 10px var(--ice-white);
  }

  /* منوی موبایل (همبرگری) */
  .mobile-menu-btn {
    display: none; background: transparent; border: none; color: #fff; font-size: 24px; cursor: pointer; padding: 5px;
  }
  .mobile-menu {
    position: fixed; inset: 0; background: rgba(5, 2, 8, 0.98); backdrop-filter: blur(20px); z-index: 99;
    padding: 80px 20px 40px; overflow-y: auto; transform: translateX(100%); transition: transform 0.4s cubic-bezier(0.2, 0.9, 0.3, 1);
    display: flex; flex-direction: column; gap: 15px;
  }
  .mobile-menu.open { transform: translateX(0); }
  .mob-cat-group { border: 1px solid rgba(255,255,255,0.1); border-radius: 16px; overflow: hidden; }
  .mob-cat-header {
    background: rgba(255,255,255,0.03); padding: 16px; font-weight: 800; font-size: 1rem; cursor: pointer;
    display: flex; justify-content: space-between; align-items: center;
  }
  .mob-cat-header .icon { transition: transform 0.3s; }
  .mob-cat-group.active .mob-cat-header .icon { transform: rotate(180deg); }
  .mob-sub-list { display: none; padding: 10px 16px; background: rgba(0,0,0,0.2); }
  .mob-cat-group.active .mob-sub-list { display: flex; flex-direction: column; gap: 10px; }
  .mob-sub-list a { color: #a0a0b0; text-decoration: none; font-size: 0.9rem; padding: 8px 0; border-bottom: 1px dashed rgba(255,255,255,0.05); }
  .mob-sub-list a:last-child { border-bottom: none; }

  @media (max-width: 900px) {
    .mega-menu-wrapper { display: none; }
    .mobile-menu-btn { display: block; }
  }

  /* ============ استایل‌های عمومی صفحات ============ */
  .hero { 
    height: 100vh; display: flex; align-items: center; justify-content: center; flex-direction: column; text-align: center; 
    padding: 160px 20px 60px; position: relative;
  }
  .hero-title {
    font-family: 'Orbitron', sans-serif; font-size: clamp(2rem, 6vw, 4.5rem); font-weight: 900; line-height: 1.2;
    letter-spacing: 2px; text-transform: uppercase; background: linear-gradient(135deg, #fff, var(--ice-blue), var(--pink-light));
    -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent;
    filter: drop-shadow(0 0 40px rgba(168,220,255,0.5)); margin-bottom: 20px;
  }
  .hero-subtitle {
    font-size: 1.2rem; color: var(--ice-white); font-weight: 600; letter-spacing: 4px;
    text-shadow: 0 0 20px rgba(168,220,255,0.8); animation: pulse 3s infinite alternate;
  }
  @keyframes pulse { from { opacity: 0.6; } to { opacity: 1; } }

  .page { display: none; animation: fadeIn 0.5s ease; }
  .page.active { display: block; }
  @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

  .section-head { text-align: center; padding: 40px 20px 30px; }
  .section-title { font-size: 1.8rem; font-weight: 900; color: #fff; display: flex; align-items: center; justify-content: center; gap: 15px; }
  .section-title::before, .section-title::after { content: ''; width: 40px; height: 1px; background: linear-gradient(90deg, transparent, var(--ice-blue)); }
  .section-title::after { background: linear-gradient(90deg, var(--ice-blue), transparent); }

  .products-container { padding: 10px 40px 120px; max-width: 1400px; margin: 0 auto; }
  .products-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 30px; }
  
  /* ============ کارت محصول ============ */
  .product-card {
    position: relative; background: var(--card-bg); border-radius: 24px; padding: 14px;
    transition: transform 0.4s cubic-bezier(0.2, 0.9, 0.3, 1.3), box-shadow 0.4s;
    box-shadow: 0 10px 30px rgba(0,0,0,0.5), 0 0 0 1px rgba(168,220,255,0.1) inset;
    display: flex; flex-direction: column; will-change: transform;
  }
  .product-card:hover { transform: translateY(-8px); box-shadow: 0 20px 40px rgba(0,0,0,0.8), 0 0 0 1px rgba(168,220,255,0.4) inset, 0 0 30px rgba(157,0,255,0.2); }
  
  .product-img-wrap {
    width: 100%; aspect-ratio: 1 / 1; background: linear-gradient(160deg, #180b26, #0a0410); border-radius: 16px;
    position: relative; overflow: hidden; display: flex; align-items: center; justify-content: center; border: 1px solid rgba(168,220,255,0.05);
  }
  .product-img-wrap img { width: 100%; height: 100%; object-fit: cover; transition: transform 0.6s cubic-bezier(0.2, 0.9, 0.3, 1.2); z-index: 1; }
  .product-card:hover .product-img-wrap img { transform: scale(1.08); }
  
  .badge-tag { position: absolute; top: 12px; right: 12px; z-index: 2; padding: 6px 14px; border-radius: 50px; font-size: 11px; font-weight: 900; letter-spacing: 1px; backdrop-filter: blur(10px); }
  .badge-tag.hot { background: rgba(255,0,128,0.2); color: #ff66c4; border: 1px solid rgba(255,0,128,0.4); box-shadow: 0 0 15px rgba(255,0,128,0.3); }
  .badge-tag.new { background: rgba(0,180,216,0.2); color: #00d4ff; border: 1px solid rgba(0,180,216,0.4); box-shadow: 0 0 15px rgba(0,180,216,0.3); }
  .badge-size { position: absolute; top: 12px; left: 12px; z-index: 2; padding: 6px 12px; border-radius: 50px; font-size: 11px; font-weight: 800; background: rgba(10, 20, 30, 0.8); backdrop-filter: blur(10px); border: 1px solid rgba(168,220,255,0.6); color: var(--ice-white); display: flex; align-items: center; gap: 5px; }

  .product-info { padding: 20px 6px 10px; display: flex; flex-direction: column; gap: 12px; flex: 1; }
  .product-name { font-size: 1.15rem; font-weight: 800; color: #fff; line-height: 1.4; text-align: center; }
  .product-specs { color: #8888a0; font-size: 0.85rem; line-height: 1.6; text-align: center; flex: 1; }
  
  .product-footer { display: flex; justify-content: space-between; align-items: center; margin-top: auto; }
  .price-block { display: flex; flex-direction: column; gap: 2px; }
  .price-label { font-size: 10px; color: #66667a; }
  .price-val { font-size: 1.25rem; font-weight: 900; background: linear-gradient(90deg, var(--ice-white), var(--ice-blue)); -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent; filter: drop-shadow(0 0 10px rgba(168,220,255,0.4)); }
  .price-val .unit { font-size: 0.7rem; -webkit-text-fill-color: #7a7a8f; font-weight: 500; }
  
  .add-btn {
    width: 42px; height: 42px; border-radius: 12px; background: rgba(168,220,255,0.1); border: 1px solid rgba(168,220,255,0.3); color: #fff;
    display: flex; align-items: center; justify-content: center; font-size: 22px; font-weight: 700; cursor: pointer;
    transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275); box-shadow: 0 4px 10px rgba(0,0,0,0.3);
  }
  .add-btn:hover { background: var(--ice-blue); color: #000; border-color: var(--ice-white); transform: translateY(-8px) scale(1.15); box-shadow: 0 15px 25px rgba(168,220,255,0.4), 0 0 20px rgba(168,220,255,0.6); }
  
  .size-btn {
    width: 100%; margin-top: 8px; padding: 12px; border-radius: 12px; background: rgba(168,220,255,0.05); border: 1px solid rgba(168,220,255,0.3);
    color: var(--ice-white); font-family: inherit; font-size: 13px; font-weight: 700; display: flex; align-items: center; justify-content: center; gap: 8px;
    transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275); cursor: pointer; box-shadow: 0 4px 10px rgba(0,0,0,0.3);
  }
  .size-btn:hover { background: rgba(168,220,255,0.15); border-color: var(--ice-white); transform: translateY(-5px) scale(1.02); box-shadow: 0 15px 25px rgba(0,0,0,0.5), 0 0 20px rgba(168,220,255,0.4); }
  .size-btn .size-chosen { color: #00ff9d; text-shadow: 0 0 10px rgba(0,255,157,0.8); }

  /* ============ مودال‌ها ============ */
  .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.9); backdrop-filter: blur(20px); z-index: 1000; display: none; align-items: center; justify-content: center; padding: 20px; opacity: 0; transition: opacity 0.3s; }
  .modal-overlay.active { display: flex; opacity: 1; }
  .modal { background: var(--card-bg); border-radius: 24px; width: 100%; max-width: 600px; max-height: 90vh; display: flex; flex-direction: column; box-shadow: 0 20px 60px rgba(0,0,0,0.8), 0 0 0 1px rgba(168,220,255,0.2); transform: scale(0.9) translateY(20px); transition: transform 0.4s; overflow: hidden; }
  .modal-overlay.active .modal { transform: scale(1) translateY(0); }
  
  .modal-header { padding: 20px 24px; border-bottom: 1px solid rgba(255,255,255,0.05); display: flex; justify-content: space-between; align-items: center; background: rgba(0,0,0,0.2); }
  .modal-header h2 { font-size: 1.2rem; display: flex; align-items: center; gap: 10px; font-weight: 800; }
  .close-btn { background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1); color: #fff; width: 36px; height: 36px; border-radius: 50%; font-size: 1.1rem; display: flex; align-items: center; justify-content: center; cursor: pointer; transition: 0.3s; }
  .close-btn:hover { background: rgba(255,0,128,0.2); border-color: var(--pink); transform: rotate(90deg); }
  .modal-body { padding: 24px; overflow-y: auto; flex: 1; }
  .modal-footer { padding: 20px 24px; border-top: 1px solid rgba(255,255,255,0.05); background: rgba(0,0,0,0.2); }

  /* سبد خرید */
  .cart-item { display: flex; gap: 14px; align-items: center; padding: 12px; background: rgba(255,255,255,0.02); border: 1px solid rgba(255,255,255,0.05); border-radius: 16px; margin-bottom: 12px; }
  .cart-item-img { width: 60px; height: 60px; border-radius: 12px; background: var(--card-inner); display: flex; align-items: center; justify-content: center; overflow: hidden; }
  .cart-item-img img { width: 100%; height: 100%; object-fit: cover; }
  .cart-item-info { flex: 1; }
  .cart-item-name { font-weight: 700; font-size: 0.9rem; }
  .cart-item-size { display: inline-block; margin-top: 4px; padding: 2px 8px; background: rgba(168,220,255,0.1); border: 1px solid rgba(168,220,255,0.3); border-radius: 6px; font-size: 0.7rem; color: var(--ice-white); }
  .cart-item-price { font-size: 0.85rem; color: #fff; margin-top: 4px; font-weight: 700; }
  
  .qty-control { display: flex; align-items: center; background: rgba(255,255,255,0.05); border-radius: 10px; padding: 3px; border: 1px solid rgba(255,255,255,0.1); }
  .qty-btn { width: 26px; height: 26px; border: none; background: transparent; color: #fff; border-radius: 6px; cursor: pointer; }
  .qty-btn:hover { background: rgba(255,255,255,0.1); }
  .qty-val { min-width: 20px; text-align: center; font-weight: 800; font-size: 0.9rem; }
  .remove-btn { background: transparent; border: none; color: #ff5577; font-size: 1.1rem; cursor: pointer; padding: 6px; }
  
  .total-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; padding: 14px 18px; background: rgba(255,255,255,0.03); border-radius: 12px; }
  .total-price { font-size: 1.4rem; font-weight: 900; color: var(--ice-white); }

  /* دکمه‌های پرداخت */
  .checkout-options { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .checkout-btn { 
    width: 100%; padding: 16px; border: none; border-radius: 14px; font-family: inherit; font-weight: 800; font-size: 1rem; 
    transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275); display: flex; align-items: center; justify-content: center; gap: 10px; cursor: pointer; 
  }
  .checkout-btn.tg { background: linear-gradient(135deg, #0088cc, #00b4d8); color: #fff; box-shadow: 0 8px 25px rgba(0,136,204,0.4); }
  .checkout-btn.ble { background: linear-gradient(135deg, #00c853, #00e676); color: #000; box-shadow: 0 8px 25px rgba(0,200,83,0.4); }

    'توپ': ['سالنی', 'چمن', 'رقابت های محبوب جهان'],
    'کفش': ['کفش ورزشی', 'کفش رانینگ', 'کفش بسکتبال'] // چون زیرمجموعه ندادی، چند مورد پیش‌فرض گذاشتم
  };

  // ★★★ ۲. دیتابیس نمونه محصولات (برای تست نمایش) ★★★
  // از ساختار "دسته اصلی - زیردسته" استفاده می‌کنم تا فیلتر کردن راحت باشه
  const PRODUCTS = [
    { id: 'P1', cat: 'زمستونی', subCat: 'ست', name: 'ست زمستانی کوهنوردی', specs: 'گرم و ضدآب', price: 1250000, image: 'https://images.pexels.com/photos/4498156/pexels-photo-4498156.jpeg?auto=compress&cs=tinysrgb&w=400', requiresSize: true },
    { id: 'P2', cat: 'تابستونی', subCat: 'تیشرت مردانه', name: 'تیشرت نخی آستین کوتاه', specs: 'نخ پنبه خنک', price: 250000, image: 'https://images.pexels.com/photos/4498606/pexels-photo-4498606.jpeg?auto=compress&cs=tinysrgb&w=400', requiresSize: true },
    { id: 'P3', cat: 'تابستونی', subCat: 'شلوارک زنانه', name: 'شلوارک ورزشی زنانه', specs: 'کشباف راحت', price: 320000, image: 'https://images.pexels.com/photos/4498482/pexels-photo-4498482.jpeg?auto=compress&cs=tinysrgb&w=400', requiresSize: true },
    { id: 'P4', cat: 'بدنسازی', subCat: 'دستکش بدنسازی', name: 'دستکش بدنسازی چرم', specs: 'چرم طبیعی ضدتعریق', price: 180000, image: 'https://images.pexels.com/photos/3836880/pexels-photo-3836880.jpeg?auto=compress&cs=tinysrgb&w=400', requiresSize: false },
    { id: 'P5', cat: 'بدنسازی', subCat: 'طناب', name: 'طناب ورزشی حرفه‌ای', specs: 'بلبرینگ چرخان', price: 150000, image: 'https://images.pexels.com/photos/4498482/pexels-photo-4498482.jpeg?auto=compress&cs=tinysrgb&w=400', requiresSize: false },

    { id: 'P7', cat: 'توپ', subCat: 'چمن', name: 'توپ فوتبال چمن', specs: 'استاندارد سایز ۵', price: 380000, image: 'https://images.pexels.com/photos/47730/the-ball-stadion-football-the-pitch-47730.jpeg?auto=compress&cs=tinysrgb&w=400', requiresSize: false },
    { id: 'P8', cat: 'کفش', subCat: 'کفش رانینگ', name: 'کفش دوی حرفه‌ای', specs: 'زیره فوم واکنشی', price: 3200000, image: 'https://images.unsplash.com/photo-1542291026-7eec264c27ff?auto=format&fit=crop&w=600&q=80', requiresSize: false }
  ];

  // ===== ساخت منوها =====
  const megaWrapper = document.getElementById('megaMenuWrapper');
  const mobileMenuContent = document.getElementById('mobileMenuContent');
  let activeCat = 'همه محصولات';
  let activeSubCat = '';

  // ساخت منوی دسکتاپ
  for (const [mainCat, subs] of Object.entries(CATEGORIES_DATA)) {
    const item = document.createElement('div');
    item.className = 'mega-item';
    
    const btn = document.createElement('button');
    btn.className = 'mega-btn';
    btn.innerHTML = `${mainCat} <span style="font-size: 10px;">▼</span>`;
    item.appendChild(btn);

    const panel = document.createElement('div');
    panel.className = 'mega-panel';
    
    // دکمه "همه محصولات" در بالای پنل
    const allBtn = document.createElement('a');
    allBtn.className = 'sub-cat-btn';
    allBtn.style.fontWeight = '900';
    allBtn.style.color = 'var(--ice-blue)';
    allBtn.textContent = `همه ${mainCat}`;
    allBtn.onclick = () => filterProducts(mainCat, '');
    panel.appendChild(allBtn);

    // زیردسته‌ها
    subs.forEach(sub => {
      const subBtn = document.createElement('a');
      subBtn.className = 'sub-cat-btn';
      subBtn.textContent = sub;
      subBtn.onclick = () => filterProducts(mainCat, sub);
      panel.appendChild(subBtn);
    });

    item.appendChild(panel);
    megaWrapper.appendChild(item);
  }
  // دکمه "همه محصولات" در ابتدای منو
  const allItem = document.createElement('div');
  allItem.className = 'mega-item';
  allItem.innerHTML = `<button class="mega-btn" onclick="filterProducts('همه محصولات', '')">همه محصولات</button>`;
  megaWrapper.prepend(allItem);


  // ساخت منوی موبایل (آکاردئونی)
  for (const [mainCat, subs] of Object.entries(CATEGORIES_DATA)) {
    const group = document.createElement('div');
    group.className = 'mob-cat-group';
    
    const header = document.createElement('div');
    header.className = 'mob-cat-header';
    header.innerHTML = `<span>${mainCat}</span> <span class="icon">▼</span>`;
    header.onclick = () => {
      group.classList.toggle('active');
    };
    group.appendChild(header);

    const subList = document.createElement('div');
    subList.className = 'mob-sub-list';
    
    const allBtn = document.createElement('a');
    allBtn.textContent = `همه ${mainCat}`;
    allBtn.style.color = 'var(--ice-blue)';
    allBtn.onclick = () => { filterProducts(mainCat, ''); toggleMobileMenu(); };
    subList.appendChild(allBtn);

    subs.forEach(sub => {
      const subBtn = document.createElement('a');
      subBtn.textContent = sub;
      subBtn.onclick = () => { filterProducts(mainCat, sub); toggleMobileMenu(); };
      subList.appendChild(subBtn);
    });

    group.appendChild(subList);
    mobileMenuContent.appendChild(group);
  }

  // ===== توابع فیلتر و نمایش =====
  function filterProducts(cat, subCat) {
    activeCat = cat;
    activeSubCat = subCat;
    showPage('category');
    
    const title = subCat ? `${cat} - ${subCat}` : (cat === 'همه محصولات' ? 'همه محصولات' : `همه ${cat}`);
    document.getElementById('currentCategoryTitle').textContent = title;
    
    renderProducts();
  }

  function showPage(pageId) {
    document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
    if (pageId === 'home') {
      document.getElementById('home').classList.add('active');
    } else {
      document.getElementById('category-page').classList.add('active');
    }
    window.scrollTo(0, 0);
  }

  // توگل کردن منوی موبایل
  function toggleMobileMenu() {
    document.getElementById('mobileMenu').classList.toggle('open');
    document.body.style.overflow = document.getElementById('mobileMenu').classList.contains('open') ? 'hidden' : '';
  }

  // ===== رندر محصولات =====
  const grid = document.getElementById('productsGrid');
  const formatPrice = (n) => n.toLocaleString('fa-IR');
  const chosenSizes = {};

  function renderProducts() {
    let filtered = PRODUCTS;
    if (activeCat !== 'همه محصولات') {
      filtered = filtered.filter(p => p.cat === activeCat);
      if (activeSubCat) {
        filtered = filtered.filter(p => p.subCat === activeSubCat);
      }
    }

    if (filtered.length === 0) {
      grid.innerHTML = `<div style="grid-column: 1/-1; text-align: center; padding: 50px; color: #666;">محصولی در این دسته یافت نشد.</div>`;
      return;
    }

    grid.innerHTML = filtered.map((p) => {
      const sizeIcon = p.requiresSize ? `<div class="badge-size">📏 سایز</div>` : '';
      
      const footer = p.requiresSize ? `
        <div class="product-footer" style="flex-direction: column;">
          <div class="price-block" style="align-self: flex-start; margin-bottom: 12px;">
            <span class="price-label">قیمت</span>
            <span class="price-val">${formatPrice(p.price)} <span class="unit">تومان</span></span>
          </div>
          <button class="size-btn" onclick="openSizeModal('${p.id}')">
            <span>📏</span>
            <span id="size-label-${p.id}">${chosenSizes[p.id] ? 'سایز: ' + chosenSizes[p.id] : 'انتخاب سایز'}</span>
          </button>
        </div>
      ` : `
        <div class="product-footer">
          <div class="price-block">
            <span class="price-label">قیمت</span>
            <span class="price-val">${formatPrice(p.price)} <span class="unit">تومان</span></span>
          </div>
          <button class="add-btn" id="btn-${p.id}" onclick="addToCart('${p.id}')">+</button>
        </div>
      `;
      
      return `
      <div class="product-card">
        <div class="product-img-wrap">
          ${sizeIcon}
          <img src="${p.image}" alt="${p.name}" onerror="this.src='data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHdpZHRoPSIxMDAlIiBoZWlnaHQ9IjEwMCUiPjxyZWN0IHdpZHRoPSIxMDAlIiBoZWlnaHQ9IjEwMCUiIGZpbGw9IiMxMzBhMWUiLz48dGV4dCB4PSI1MCUiIHk9IjUwJSIgZmlsbD0iIzY2NiIgZm9udC1zaXplPSIxNCIgdGV4dC1hbmNob3I9Im1pZGRsZSI+2LnZg9izINmG2K/Yp9ix2K88L3RleHQ+PC9zdmc+';">
        </div>
        <div class="product-info">
          <div class="product-name">${p.name}</div>
          <div class="product-specs">${p.specs}</div>
          ${footer}
        </div>
      </div>
      `;
    }).join('');
  }

  // ===== بقیه توابع (سایز، سبد خرید و...) مثل قبل =====
  let currentSizeProduct = null;
  const sizeModal = document.getElementById('sizeModal');
  const heightSlider = document.getElementById('heightSlider');
  const weightSlider = document.getElementById('weightSlider');
  const waistSlider = document.getElementById('waistSlider');
  const heightVal = document.getElementById('heightVal');
  const weightVal = document.getElementById('weightVal');
  const waistVal = document.getElementById('waistVal');
  const heightFill = document.getElementById('heightFill');
  const weightFill = document.getElementById('weightFill');
  const waistFill = document.getElementById('waistFill');
  const resultSize = document.getElementById('resultSize');

  function openSizeModal(productId) {
    currentSizeProduct = PRODUCTS.find(p => p.id === productId);
    heightSlider.value = 175; weightSlider.value = 70; waistSlider.value = 82;
    updateSliders(); calculateSize();
    sizeModal.classList.add('active'); document.body.style.overflow = 'hidden';
  }

  function closeSizeModal() {
    sizeModal.classList.remove('active'); document.body.style.overflow = ''; currentSizeProduct = null;
  }
  sizeModal.addEventListener('click', (e) => { if (e.target.id === 'sizeModal') closeSizeModal(); });

  function updateSliders() {
    const h = +heightSlider.value, w = +weightSlider.value, wa = +waistSlider.value;
    heightVal.textContent = h; weightVal.textContent = w; waistVal.textContent = wa;
    heightFill.style.width = ((h - 150) / (210 - 150)) * 100 + '%';
    weightFill.style.width = ((w - 40) / (130 - 40)) * 100 + '%';
    waistFill.style.width = ((wa - 60) / (130 - 60)) * 100 + '%';
  }

  function calculateSize() {
    const h = +heightSlider.value, w = +weightSlider.value, wa = +waistSlider.value;
    const bmi = w / Math.pow(h / 100, 2);
    let waistScore = wa < 70 ? 1 : wa < 78 ? 2 : wa < 88 ? 3 : wa < 98 ? 4 : wa < 108 ? 5 : wa < 120 ? 6 : 7;
    let bmiScore = bmi < 18.5 ? 1.3 : bmi < 21 ? 2 : bmi < 24 ? 3 : bmi < 27 ? 4 : bmi < 31 ? 5 : 6;
    let heightScore = h > 195 ? 1 : h > 185 ? 0.5 : h < 160 ? -0.5 : 0;
    
    const finalScore = waistScore * 0.6 + bmiScore * 0.4 + heightScore;
    const sizes = ['XS', 'S', 'M', 'L', 'XL', 'XXL', 'XXXL'];
    let sizeIndex = Math.max(0, Math.min(sizes.length - 1, Math.round(finalScore) - 1));
    resultSize.textContent = sizes[sizeIndex];
  }

  heightSlider.addEventListener('input', () => { updateSliders(); calculateSize(); });
  weightSlider.addEventListener('input', () => { updateSliders(); calculateSize(); });
  waistSlider.addEventListener('input', () => { updateSliders(); calculateSize(); });

  function confirmSize() {
    if (!currentSizeProduct) return;
    const size = resultSize.textContent;
    const productId = currentSizeProduct.id;
    chosenSizes[productId] = size;
    const sizeLabel = document.getElementById('size-label-' + productId);
    if (sizeLabel) sizeLabel.innerHTML = `سایز: <span class="size-chosen">${size}</span>`;
    addToCartWithSize(productId, size);
    closeSizeModal();
  }

  let cart = [];

  function addToCart(id) {
    const product = PRODUCTS.find(p => p.id === id);
    const existing = cart.find(i => i.id === id && !i.size);
    if (existing) existing.qty += 1;
    else cart.push({ ...product, qty: 1, size: null });
    updateCartUI();
    showToast(`✓ ${product.name} اضافه شد`);
    const btn = document.getElementById('btn-' + id);
    if (btn) { btn.textContent = '✓'; setTimeout(() => { btn.textContent = '+'; }, 1000); }
  }

  function addToCartWithSize(id, size) {
    const product = PRODUCTS.find(p => p.id === id);
    const existing = cart.find(i => i.id === id && i.size === size);
    if (existing) existing.qty += 1;
    else cart.push({ ...product, qty: 1, size: size });
    updateCartUI();
    showToast(`✓ ${product.name} (سایز ${size}) اضافه شد`);
  }

  function changeQty(id, size, delta) {
    const item = cart.find(i => i.id === id && i.size === size);
    if (!item) return;
    item.qty += delta;
    if (item.qty <= 0) cart = cart.filter(i => !(i.id === id && i.size === size));
    updateCartUI();
  }

  function removeItem(id, size) { cart = cart.filter(i => !(i.id === id && i.size === size)); updateCartUI(); }

  function updateCartUI() {
    const totalQty = cart.reduce((s, i) => s + i.qty, 0);
    const countEl = document.getElementById('cartCount');
    countEl.textContent = totalQty; countEl.classList.add('bump'); setTimeout(() => countEl.classList.remove('bump'), 300);
    
    const body = document.getElementById('cartBody');
    const totalEl = document.getElementById('totalPrice');
    
    if (cart.length === 0) {
      body.innerHTML = `<div style="text-align: center; padding: 40px; color: #666;">سبد خرید شما خالی است</div>`;
      totalEl.textContent = '۰ تومان'; return;
    }
    
    body.innerHTML = cart.map(item => `
      <div class="cart-item">
        <div class="cart-item-img"><img src="${item.image}"></div>
        <div class="cart-item-info">
          <div class="cart-item-name">${item.name}</div>
          ${item.size ? `<div class="cart-item-size">📏 سایز: ${item.size}</div>` : ''}
          <div class="cart-item-price">${formatPrice(item.price * item.qty)} تومان</div>
        </div>
        <div class="qty-control">
          <button class="qty-btn" onclick="changeQty('${item.id}', ${item.size ? `'${item.size}'` : 'null'}, -1)">−</button>
          <span class="qty-val">${item.qty}</span>
          <button class="qty-btn" onclick="changeQty('${item.id}', ${item.size ? `'${item.size}'` : 'null'}, 1)">+</button>
        </div>
        <button class="remove-btn" onclick="removeItem('${item.id}', ${item.size ? `'${item.size}'` : 'null'})">🗑</button>
      </div>
    `).join('');
    
    const total = cart.reduce((s, i) => s + i.price * i.qty, 0);
    totalEl.textContent = formatPrice(total) + ' تومان';
  }

  function openCart() { updateCartUI(); document.getElementById('cartModal').classList.add('active'); document.body.style.overflow = 'hidden'; }
  function closeCart() { document.getElementById('cartModal').classList.remove('active'); document.body.style.overflow = ''; }
  document.getElementById('cartModal').addEventListener('click', (e) => { if (e.target.id === 'cartModal') closeCart(); });

  function checkout(method) {
    if (cart.length === 0) return;
    const total = cart.reduce((s, i) => s + i.price * i.qty, 0);
    let message = '🛒 سفارش جدید از SPORT T\n\n━━━━━━━━━━━━━━━\n\n';
    cart.forEach((item, idx) => {
      message += `📦 ${idx + 1}) ${item.name}\n🔖 کد: ${item.id}\n`;
      if (item.size) message += `📏 سایز: ${item.size}\n`;
      message += `📊 تعداد: ${item.qty}\n💰 قیمت: ${formatPrice(item.price * item.qty)} تومان\n\n`;
    });
    message += '━━━━━━━━━━━━━━━\n💎 مبلغ کل: ' + formatPrice(total) + ' تومان';
    
    copyToClipboard(message).then(() => {
      showToast('✓ متن سفارش کپی شد...');
      setTimeout(() => {
        if (method === 'telegram') window.open(`https://t.me/sajadth79?text=${encodeURIComponent(message)}`, '_blank');
        else window.open(`https://ble.ir/DaDio?text=${encodeURIComponent(message)}`, '_blank');
      }, 900);
    });
  }

  function copyToClipboard(text) {
    if (navigator.clipboard && navigator.clipboard.writeText) return navigator.clipboard.writeText(text);
    return new Promise((resolve, reject) => {
      const ta = document.createElement('textarea'); ta.value = text; ta.style.position = 'fixed'; ta.style.opacity = '0';
      document.body.appendChild(ta); ta.select();
      try { document.execCommand('copy'); resolve(); } catch(e) { reject(e); }
      document.body.removeChild(ta);
    });
  }

  let toastTimer;
  function showToast(msg) { const t = document.getElementById('toast'); t.textContent = msg; t.classList.add('show'); clearTimeout(toastTimer); toastTimer = setTimeout(() => t.classList.remove('show'), 2800); }

  // ===== رعد و برق =====
  const lightningContainer = document.getElementById('lightningContainer');
  const lightningFlash = document.getElementById('lightningFlash');
  
  function createLightningBolt() {
    const startX = Math.random() * 100;
    const startY = -10;
    const endX = startX + (Math.random() - 0.5) * 50;
    const endY = 60 + Math.random() * 40;
    
    const path = generateLightningPath(startX, startY, endX, endY);
    const branch1 = generateLightningPath(startX + (endX-startX)*0.3, startY + (endY-startY)*0.3, startX + (Math.random()-0.5)*90, startY + (endY-startY)*0.6);
    const branch2 = generateLightningPath(startX + (endX-startX)*0.5, startY + (endY-startY)*0.5, startX + (Math.random()-0.5)*70, endY + 10);
    
    const svg = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
    svg.setAttribute('class', 'lightning-bolt strike');
    svg.setAttribute('viewBox', '0 0 100 100');
    svg.setAttribute('preserveAspectRatio', 'none');
    svg.style.cssText = `position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none;`;
    
    svg.innerHTML = `
      <path class="bolt-branch-2" d="${branch2}"/>
      <path class="bolt-branch-1" d="${branch1}"/>
      <path class="bolt-main" d="${path}"/>
    `;
    
    lightningContainer.appendChild(svg);
    
    const flashType = Math.floor(Math.random() * 2) + 1;
    lightningFlash.style.setProperty('--fx', startX + '%');
    lightningFlash.style.setProperty('--fy', startY + 20 + '%');
    lightningFlash.className = 'lightning-flash';
    void lightningFlash.offsetWidth;
    lightningFlash.classList.add('flash-' + flashType);
    
    setTimeout(() => svg.remove(), 1500);
  }
  
  function generateLightningPath(x1, y1, x2, y2) {
    const segments = 15 + Math.floor(Math.random() * 10);
    let path = `M${x1},${y1}`;
    let cx = x1, cy = y1;
    for (let i = 1; i <= segments; i++) {
      const p = i / segments;
      cx = x1 + (x2 - x1) * p + (Math.random() - 0.5) * 4;
      cy = y1 + (y2 - y1) * p + (Math.random() - 0.5) * 1;
      path += ` L${cx.toFixed(2)},${cy.toFixed(2)}`;
    }
    return path;
  }
  
  function scheduleLightning() {
    const delay = 3000 + Math.random() * 4000;
    setTimeout(() => {
      createLightningBolt();
      if (Math.random() < 0.3) setTimeout(createLightningBolt, 200 + Math.random() * 300);
      scheduleLightning();
    }, delay);
  }
  setTimeout(() => { createLightningBolt(); scheduleLightning(); }, 2000);
  
  // باران
  const rainCanvas = document.getElementById('rain-canvas');
  const rainCtx = rainCanvas.getContext('2d');
  let rainDrops = [];
  function resizeRain() { rainCanvas.width = window.innerWidth; rainCanvas.height = window.innerHeight; }
  resizeRain(); window.addEventListener('resize', resizeRain);
  class RainDrop {
    constructor() { this.reset(); }
    reset() { this.x = Math.random() * rainCanvas.width; this.y = -20; this.length = 10 + Math.random() * 20; this.speed = 4 + Math.random() * 6; this.opacity = 0.2 + Math.random() * 0.5; }
    update() { this.y += this.speed; this.x -= this.speed * 0.15; if (this.y > rainCanvas.height + 20) this.reset(); }
    draw() { rainCtx.strokeStyle = `rgba(168,220,255,${this.opacity})`; rainCtx.lineWidth = 1; rainCtx.beginPath(); rainCtx.moveTo(this.x, this.y); rainCtx.lineTo(this.x - 1, this.y + this.length); rainCtx.stroke(); }
  }
  for (let i = 0; i < 80; i++) { const d = new RainDrop(); d.y = Math.random() * rainCanvas.height; rainDrops.push(d); }
  function animateRain() { rainCtx.clearRect(0, 0, rainCanvas.width, rainCanvas.height); rainDrops.forEach(d => { d.update(); d.draw(); }); requestAnimationFrame(animateRain); }
  animateRain();

  // شروع
  window.addEventListener('load', () => { setTimeout(() => { document.getElementById('loader').classList.add('hidden'); }, 1200); });
  renderProducts();
  updateCartUI();
</script>
</body>
</html>
